name: Deploy RiskWise Next to GitHub Pages

# Builds the riskwise-next/ app and publishes it to GitHub Pages on every push
# to the working branch. One-time setup: in repo Settings → Pages, set
# "Build and deployment → Source" to "GitHub Actions".

on:
  push:
    branches:
      - claude/security-errors-review-vnxj2f
    paths:
      - "riskwise-next/**"
      - ".github/workflows/deploy-riskwise-next.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riskwise-next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: riskwise-next/package-lock.json

      - run: npm ci

      - name: Build
        env:
          # Serve assets from /<repo>/ so paths resolve on Pages.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: riskwise-next/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
