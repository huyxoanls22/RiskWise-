<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiskWise Admin - Bộ Tạo License Key Ngoại Tuyến</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-[#06080C] text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 gap-6">
  
  <div class="max-w-md w-full bg-[#10131A] border border-amber-500/20 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
    <!-- Decorative background glow -->
    <div class="absolute -right-16 -top-16 w-36 h-36 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute -left-16 -bottom-16 w-36 h-36 bg-indigo-550/15 rounded-full blur-2xl pointer-events-none"></div>

    <!-- Header -->
    <div class="text-center mb-6 relative">
      <div class="mx-auto w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-500 flex items-center justify-center mb-3">
        <!-- Shield Icon SVG -->
        <svg class="w-6 h-6 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <h1 class="text-lg font-extrabold text-white tracking-widest uppercase">RISKWISE ADMIN</h1>
      <p class="text-xs text-slate-450 mt-1 uppercase font-bold tracking-wider">Hệ thống tạo License Key ngoại tuyến (Offline)</p>
    </div>

    <!-- Content Form -->
    <div class="space-y-4 relative">
      
      <!-- Email input -->
      <div class="space-y-1">
        <label for="email" class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Email khách hàng:</label>
        <input 
          type="email" 
          id="email" 
          placeholder="example@gmail.com" 
          class="w-full bg-[#080a0f] border border-slate-800 text-slate-100 placeholder-slate-600 focus:border-amber-550 focus:ring-1 focus:ring-amber-500/50 focus:outline-none text-xs py-2.5 px-3.5 rounded-xl transition duration-150"
          value=""
        >
      </div>

      <!-- Key Options Dropdown Selector -->
      <div class="space-y-1">
        <label for="key-prefix" class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Tỳ chọn Gói cước License Key:</label>
        <select 
          id="key-prefix" 
          class="w-full bg-[#080a0f] border border-slate-800 text-slate-200 focus:border-amber-550 focus:ring-1 focus:ring-amber-500/50 focus:outline-none text-xs py-2.5 px-3.5 rounded-xl transition duration-150 cursor-pointer"
        >
          <option value="RW-MTH-" selected>Gói tháng tiêu chuẩn (RW-MTH-)</option>
          <option value="RW-YEAR-">Gói năm tiêu chuẩn (RW-YEAR-)</option>
          <option value="RW5-MTH-">Gói tháng ưu đãi giảm 5% (RW5-MTH-)</option>
          <option value="RW10-YEAR-">Gói năm ưu đãi giảm 10% (RW10-YEAR-)</option>
        </select>
      </div>

      <!-- Generate button -->
      <button 
        type="button" 
        id="btn-generate"
        class="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-955 text-xs font-black rounded-xl transition duration-150 uppercase tracking-wider flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-amber-950/20"
      >
        <!-- Hammer/Wrench or Key Icon SVG -->
        <svg class="w-4 h-4 text-slate-950" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
        </svg>
        ĐÚC LICENSE KEY CỦA BẠN
      </button>

      <!-- Error message -->
      <div id="error-box" class="p-3 bg-rose-950/20 border border-rose-900/30 text-rose-400 text-xs rounded-xl hidden flex items-start gap-2">
        <svg class="w-4 h-4 text-rose-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span id="error-message" class="font-semibold leading-relaxed"></span>
      </div>

      <!-- Result key -->
      <div id="result-box" class="space-y-2 hidden">
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            License Key đã đúc thành công:
          </span>
          <button 
            type="button" 
            id="btn-copy"
            class="text-[10.5px] text-amber-500 hover:text-amber-400 font-bold uppercase tracking-wider transition hover:underline bg-transparent border-0 cursor-pointer"
          >
            Sao chép mã 📋
          </button>
        </div>
        
        <textarea 
          id="license-output" 
          readonly 
          rows="3" 
          class="w-full bg-[#080a0f] border border-emerald-950/20 text-slate-300 placeholder-slate-600 focus:outline-none font-mono text-[11px] leading-relaxed p-3.5 rounded-xl resize-none select-all select-text border border-emerald-500/20"
        ></textarea>
        
        <p class="text-[10px] text-slate-500 text-center font-medium italic">
          🔑 License chứa thông tin ký số bằng chuỗi khoá bảo mật. Chỉ có ứng dụng RiskWise mới có dữ liệu giải mã chuỗi này.
        </p>
      </div>

    </div>
  </div>

  <!-- Key History Container -->
  <div class="max-w-md w-full bg-[#10131A] border border-slate-800/80 rounded-3xl p-6 shadow-2xl relative overflow-hidden" id="history-card" style="display: none;">
    <h3 class="text-xs font-bold text-amber-500 uppercase tracking-wider mb-3 flex items-center gap-1.5">
      📋 Lịch sử đúc License Key (LocalStorage)
    </h3>
    <div class="space-y-2.5 max-h-60 overflow-y-auto pr-1 text-xs" id="history-list">
      <!-- Generated items will be listed here -->
    </div>
    <div class="mt-4 flex justify-end">
      <button 
        type="button" 
        id="btn-clear-history" 
        class="text-[10px] text-rose-400 hover:text-rose-350 font-bold uppercase tracking-wider bg-transparent border-0 cursor-pointer underline hover:no-underline"
      >
        Xóa lịch sử 🗑️
      </button>
    </div>
  </div>

  <script>
    // System core keys, must match exactly with App configuration inside src/utils/license.ts
    const SECRET_SIGNING_KEY = "RISKWISE_SECURE_KEY_2026";

    // Hash signature builder
    const simpleHash = (str) => {
      let hash = 5381;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) + hash) + str.charCodeAt(i);
      }
      return (hash >>> 0).toString(16).toUpperCase();
    };

    // Polyfill custom Base64 Encoder to prevent UTF-8 characters breakages
    const base64Encode = (str) => {
      try {
        return btoa(unescape(encodeURIComponent(str)));
      } catch (e) {
        return "";
      }
    };

    // Controller handlers
    const btnGenerate = document.getElementById('btn-generate');
    const inputEmail = document.getElementById('email');
    const selectPrefix = document.getElementById('key-prefix');
    const errorBox = document.getElementById('error-box');
    const errorMessage = document.getElementById('error-message');
    const resultBox = document.getElementById('result-box');
    const licenseOutput = document.getElementById('license-output');
    const btnCopy = document.getElementById('btn-copy');

    // Helper function to render history from localStorage
    const renderHistory = () => {
      const historyCard = document.getElementById('history-card');
      const historyList = document.getElementById('history-list');
      try {
        const storedKeysStr = localStorage.getItem('rw_generated_keys') || '[]';
        const storedKeys = JSON.parse(storedKeysStr);
        if (storedKeys.length > 0) {
          historyCard.style.display = 'block';
          historyList.innerHTML = '';
          // Show starting from newest first
          [...storedKeys].reverse().forEach((item) => {
            const itemDiv = document.createElement('div');
            itemDiv.className = "p-2.5 bg-[#080a0f] border border-slate-800 rounded-xl space-y-1 relative group";
            
            // Format nice human-readable prefix labels
            let label = "Gói tháng";
            if (item.prefix === "RW10-YEAR-") label = "Gói năm (giảm 10%)";
            else if (item.prefix === "RW5-MTH-") label = "Gói tháng (giảm 5%)";
            else if (item.prefix === "RW-YEAR-") label = "Gói năm";

            itemDiv.innerHTML = `
              <div class="flex justify-between items-center">
                <span class="font-bold text-amber-500 text-[10px] uppercase font-mono">${label}</span>
                <span class="text-[9px] text-slate-500 font-mono">Hạn: ${item.expiryDate}</span>
              </div>
              <div class="text-[10px] text-slate-350 truncate">Email: <span class="text-white font-medium">${item.email}</span></div>
              <div class="flex items-center gap-1.5 mt-1">
                <input value="${item.key}" readonly class="bg-[#05070a] border border-slate-900 text-slate-400 font-mono text-[9px] px-1.5 py-0.5 rounded flex-1 select-all" type="text" />
                <button type="button" class="btn-copy-item text-[9px] text-amber-500 hover:text-amber-400 font-bold transition cursor-pointer">
                  Copy
                </button>
              </div>
            `;
            
            // Add copy action
            const copyBtn = itemDiv.querySelector('.btn-copy-item');
            copyBtn.addEventListener('click', () => {
              navigator.clipboard.writeText(item.key).then(() => {
                copyBtn.textContent = "Ok! ✓";
                copyBtn.classList.remove('text-amber-500');
                copyBtn.classList.add('text-emerald-400');
                setTimeout(() => {
                  copyBtn.textContent = "Copy";
                  copyBtn.classList.add('text-amber-500');
                  copyBtn.classList.remove('text-emerald-400');
                }, 1000);
              });
            });

            historyList.appendChild(itemDiv);
          });
        } else {
          historyCard.style.display = 'none';
        }
      } catch (e) {
        console.error(e);
        historyCard.style.display = 'none';
      }
    };

    btnGenerate.addEventListener('click', () => {
      // Clear output
      errorBox.classList.add('hidden');
      resultBox.classList.add('hidden');
      
      const email = inputEmail.value.trim().toLowerCase();
      if (!email || !email.includes('@')) {
        errorMessage.textContent = "Bạn phải nhập một địa chỉ Email khách hàng hợp lệ (ví dụ: customer@gmail.com).";
        errorBox.classList.remove('hidden');
        return;
      }

      const prefix = selectPrefix.value;
      let daysToAdd = 30; // default for month
      if (prefix.includes("YEAR")) {
        daysToAdd = 365;
      }
      
      // Calculate target Expiration Date representation (YYYY-MM-DD)
      const expiryDate = new Date();
      expiryDate.setDate(expiryDate.getDate() + daysToAdd);
      
      const yyyy = expiryDate.getFullYear();
      const mm = String(expiryDate.getMonth() + 1).padStart(2, '0');
      const dd = String(expiryDate.getDate()).padStart(2, '0');
      const targetExpiryStr = `${yyyy}-${mm}-${dd}`;

      // Build signing package
      const payloadStr = `${email}:${targetExpiryStr}`;
      const encodedPayload = base64Encode(payloadStr);

      if (!encodedPayload) {
        errorMessage.textContent = "Lỗi trong quá trình mã hoá cơ số UTF-8.";
        errorBox.classList.remove('hidden');
        return;
      }

      const signature = simpleHash(`${payloadStr}:${SECRET_SIGNING_KEY}`);
      const finalLicenseKey = `${prefix}${encodedPayload}-${signature}`;

      // Save to shared localStorage using key 'rw_generated_keys'
      try {
        const storedKeysStr = localStorage.getItem('rw_generated_keys') || '[]';
        const storedKeys = JSON.parse(storedKeysStr);
        storedKeys.push({
          email: email,
          key: finalLicenseKey,
          prefix: prefix,
          generatedAt: new Date().toISOString(),
          expiryDate: targetExpiryStr
        });
        localStorage.setItem('rw_generated_keys', JSON.stringify(storedKeys));
      } catch (e) {
        console.error("Local storage error:", e);
      }

      // Set output fields safely
      licenseOutput.value = finalLicenseKey;
      resultBox.classList.remove('hidden');
      renderHistory();
    });

    // Listen on clear history
    const btnClearHistory = document.getElementById('btn-clear-history');
    btnClearHistory.addEventListener('click', () => {
      if (confirm('Bạn có chắc chắn muốn xóa toàn bộ lịch sử đúc key trong LocalStorage?')) {
        localStorage.removeItem('rw_generated_keys');
        renderHistory();
      }
    });

    btnCopy.addEventListener('click', () => {
      if (!licenseOutput.value) return;
      navigator.clipboard.writeText(licenseOutput.value).then(() => {
        const originalText = btnCopy.textContent;
        btnCopy.textContent = "Đã sao chép! ✓";
        btnCopy.classList.add('text-emerald-400');
        setTimeout(() => {
          btnCopy.textContent = originalText;
          btnCopy.classList.remove('text-emerald-400');
        }, 1800);
      });
    });

    // Run render history initially
    renderHistory();
  </script>
</body>
</html>
